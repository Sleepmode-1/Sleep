<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: darkgreen;
            text-align: center;
        }

        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background-color: #f2f2f2;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: blue; text-align: center;">
        Welcome to CSS Demo
    </h1>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <!-- External CSS -->
    <p>
        This paragraph is styled using External CSS.
    </p>

    <br>

    <!-- Table using Internal CSS -->
    <table>

        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Paras</td>
            <td>CSE</td>
            <td>Pune</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>IT</td>
            <td>Mumbai</td>
        </tr>

    </table>

</body>
</html>

p {
    color: maroon;
    font-size: 18px;
    text-align: center;
    font-family: Arial;
}
