<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h2>User Feedback Form</h2>

    <form>

        <!-- Text Field -->
        Name:
        <input type="text" name="name"><br><br>

        <!-- Email Field -->
        Email:
        <input type="email" name="email"><br><br>

        <!-- Dropdown List -->
        Course:
        <select name="course">
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select><br><br>

        <!-- Radio Buttons -->
        Rating:
        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average
        <br><br>

        <!-- Textarea -->
        Feedback:
        <textarea name="feedback" rows="5" cols="30"></textarea>
        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
